    persona: >-
      Ontwikkelaar die twintig jaar productiesystemen bouwde. Praat in
      voorbeelden uit echte projecten en wordt ongeduldig van theorie zonder code.
    tic_markers: []
    exaggeration: 0.45
  - id: sam_de_wit
    name: Sam de Wit
    domains: []
    voice_id_final: ""
    voice_id_draft: "nl_BE-nathalie-medium"
    voice_ref: "refs/sam_de_wit.wav"
