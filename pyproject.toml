[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "studiepodcast"
version = "0.1.0"
description = "Turn a Dutch study book (PDF) into a podcast series with a recurring cast."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
dependencies = [
    "pymupdf>=1.24",
    "pydantic>=2.6",
    "pyyaml>=6",
    "numpy>=1.26",
    "soundfile>=0.12",
    "pyloudnorm>=0.1",
    "rapidfuzz>=3",
    "typer>=0.12",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "soxr>=0.3",
    "pedalboard>=0.9",
    "pyspellchecker>=0.8",  # the Dutch word list behind the audit's unknown_word check; works offline
]

[project.optional-dependencies]
# Local synthesis. Installed separately because torch is large and platform-specific.
# 24GB CUDA box: Chatterbox V3 x3 workers, faster-whisper on GPU, WhisperX alignment.
cuda = [
    "chatterbox-tts>=0.1.5",  # 0.1.4 and older only know the first multilingual vocabulary
    "faster-whisper>=1.0",
    # chatterbox-tts holds torch at 2.6, which brings cuDNN 9. CTranslate2 (faster-whisper's engine) needs 4.5 or
    # newer to use cuDNN 9; 4.4 wants cuDNN 8 and hangs on a Windows GPU without it. whisperx 3.3.2 is the release
    # that both takes torch 2.6 and allows CTranslate2 4.5+ (3.3.3 to 3.4.x pin it below 4.5, 3.5+ want torch 2.7).
    "whisperx==3.3.2",
    "ctranslate2>=4.5",
]
local = ["studiepodcast[cuda]"]
dev = [
    "pytest>=8",
    "pytest-cov",
    "ruff",
]

[project.scripts]
studiepodcast = "pipeline.cli:app"

[tool.setuptools.packages.find]
include = ["app*", "pipeline*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "E741"]
