[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "studiepodcast"
version = "0.1.0"
description = "Turn a Dutch study book (PDF) into a podcast series with a recurring cast."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
dependencies = [
    "pymupdf>=1.24",
    "pydantic>=2.6",
    "pyyaml>=6",
    "numpy>=1.26",
    "soundfile>=0.12",
    "pyloudnorm>=0.1",
    "rapidfuzz>=3",
    "typer>=0.12",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "soxr>=0.3",
    "pedalboard>=0.9",
    "pyspellchecker>=0.8",  # the Dutch word list behind the audit's unknown_word check; works offline
]

[project.optional-dependencies]
# Local synthesis. Installed separately because torch is large and platform-specific.
# 24GB CUDA box: Chatterbox V3 x3 workers, faster-whisper on GPU, WhisperX alignment.
cuda = [
    "chatterbox-tts>=0.1.5",  # 0.1.4 and older only know the first multilingual vocabulary
    "faster-whisper>=1.0",
    # The GPU builds of torch (2.6 on Linux, 2.7.1 on Windows, see [tool.uv]) bring cuDNN 9. CTranslate2 (faster-whisper's
    # engine) needs 4.5 or newer to use cuDNN 9; 4.4 wants cuDNN 8 and hangs on a Windows GPU without it. whisperx 3.3.2
    # takes torch 2.6 and 2.7 and allows CTranslate2 4.5+ (3.3.3 to 3.4.x pin it below 4.5, 3.5+ want torch 2.7.1+).
    "whisperx==3.3.2",
    "ctranslate2>=4.5",
]
local = ["studiepodcast[cuda]"]
dev = [
    "pytest>=8",
    "pytest-cov",
    "ruff",
]

[tool.uv]
# torch on Windows: PyPI only has the CPU-only build there, so the voices would run on the processor, and torch 2.6
# (which chatterbox-tts pins) has no code for RTX 50 cards ("no kernel image is available for execution on the
# device"). So Windows gets torch 2.7.1 built for CUDA 12.8, straight from PyTorch's index: the GTX 16 series and every
# RTX card up to the RTX 50 series. Chatterbox's model code runs on it (its own pyproject allows torch 2.9 on Python
# 3.14). A GTX 900/1000 card needs the CUDA 12.4 build instead; `studiepodcast doctor` gives that command. Linux keeps
# the CUDA build of torch 2.6 from PyPI.
override-dependencies = [
    "torch @ https://download.pytorch.org/whl/cu128/torch-2.7.1%2Bcu128-cp311-cp311-win_amd64.whl ; sys_platform == 'win32' and python_version == '3.11'",
    "torchaudio @ https://download.pytorch.org/whl/cu128/torchaudio-2.7.1%2Bcu128-cp311-cp311-win_amd64.whl ; sys_platform == 'win32' and python_version == '3.11'",
    "torch @ https://download.pytorch.org/whl/cu128/torch-2.7.1%2Bcu128-cp312-cp312-win_amd64.whl ; sys_platform == 'win32' and python_version == '3.12'",
    "torchaudio @ https://download.pytorch.org/whl/cu128/torchaudio-2.7.1%2Bcu128-cp312-cp312-win_amd64.whl ; sys_platform == 'win32' and python_version == '3.12'",
    "torch @ https://download.pytorch.org/whl/cu128/torch-2.7.1%2Bcu128-cp313-cp313-win_amd64.whl ; sys_platform == 'win32' and python_version == '3.13'",
    "torchaudio @ https://download.pytorch.org/whl/cu128/torchaudio-2.7.1%2Bcu128-cp313-cp313-win_amd64.whl ; sys_platform == 'win32' and python_version == '3.13'",
    "torch==2.6.0; sys_platform != 'win32'",
    "torchaudio==2.6.0; sys_platform != 'win32'",
]

[project.scripts]
studiepodcast = "pipeline.cli:app"

[tool.setuptools.packages.find]
include = ["app*", "pipeline*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "E741"]
